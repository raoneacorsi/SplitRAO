<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="converterTitle">RAODEV • Conversor CSV para SplitRAO</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #f0f9ff;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .box {
      background: #fff;
      border: 1px solid #bae6fd;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
    }
    .top-link {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }
    .top-link:hover { text-decoration: underline; }
    h1 { font-size: 1.4rem; color: #0369a1; margin-top: 0; margin-bottom: 6px; }
    p { color: #64748b; font-size: 0.9rem; margin-top: 0; }
    .upload-area {
      border: 2px dashed #7dd3fc;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      margin: 20px 0;
      transition: 0.2s;
    }
    .upload-area:hover { background: #e0f2fe; border-color: #0284c7; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #334155; }
    input[type="text"] {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 0.95rem;
    }
    input[type="text"]:focus {
      outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .participantes-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin: 16px 0;
    }
    .participantes-box h3 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: #0369a1;
    }
    .acoes-botoes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      width: 100%; padding: 12px; background: #0284c7; color: #fff;
      border: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #0369a1; }
    button.btn-secundario {
      background: #e0f2fe;
      color: #0369a1;
    }
    button.btn-secundario:hover {
      background: #bae6fd;
    }
    .hidden { display: none; }
    .status {
      background: #dcfce7; color: #166534; padding: 12px;
      border-radius: 8px; font-size: 0.85rem; margin-bottom: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="box">
    <a href="index.html" class="top-link" data-i18n="converterBack">← Voltar ao SplitRAO</a>
    <h1 data-i18n="converterHeading">🔄 Conversor Splitwise ➔ SplitRAO</h1>
    <p data-i18n="converterDesc">Selecione a planilha CSV exportada do Splitwise para enviar o grupo direto para sua conta.</p>

    <!-- Etapa 1: Entrada do CSV -->
    <div class="upload-area" id="dropzone">
      <strong data-i18n="converterChoose">📂 Clique para escolher o arquivo .CSV</strong>
      <input type="file" id="csv-input" accept=".csv" hidden>
    </div>

    <!-- Etapa 2: Ajustes e Envio -->
    <div id="painel-config" class="hidden">
      <div class="field">
        <label for="grupo-nome" data-i18n="converterGroup">Nome do Grupo</label>
        <input type="text" id="grupo-nome" value="Grupo Importado">
      </div>

      <div class="participantes-box">
        <h3 data-i18n="converterPeople">👥 Participantes do Grupo (edite se necessário)</h3>
        <div id="mapeamento-nomes"></div>
      </div>

      <div id="resumo" class="status"></div>

      <div class="acoes-botoes">
        <button type="button" id="btn-enviar-app" data-i18n="converterSend">🚀 Importar direto para o SplitRAO</button>
        <button type="button" id="btn-baixar" class="btn-secundario" data-i18n="converterDownload">💾 Apenas baixar JSON</button>
      </div>
    </div>
  </div>

  <script type="module">
    // Reutiliza o idioma salvo pelo aplicativo principal.
    import { LANG_STORAGE_KEY, createTranslator } from './i18n.js';
    const { t, getNomeCategoriaTraduzido } = createTranslator(() => localStorage.getItem(LANG_STORAGE_KEY) || 'pt');
    document.documentElement.lang = localStorage.getItem(LANG_STORAGE_KEY) || 'pt';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.getElementById('grupo-nome').value = t('converterDefault');

    const SPLITWISE_IMPORT_KEY = 'raodev_splitwise_pending_import';

    function normalizarTexto(texto) {
      return (texto || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    // Categorias novas: primeiro a categoria específica do CSV, depois a descrição.
    function mapearCategoria(categoriaRaw, descricaoRaw) {
      const limpar = texto => normalizarTexto(texto).replace(/[^a-z0-9]+/g, ' ').trim();
      const cat = limpar(categoriaRaw);
      const desc = limpar(descricaoRaw);
      const regras = {
  "Mercado": [
    "mercado",
    "supermercado",
    "mantimentos",
    "groceries",
    "grocery",
    "supermarket",
    "alimentos",
    "hortifruti",
    "acougue",
    "padaria",
    "feira",
    "carniceria",
    "panaderia",
    "verduleria",
    "mercearia"
  ],
  "Comer fora": [
    "comer fora",
    "jantar fora",
    "dining out",
    "eating out",
    "restaurante",
    "restaurant",
    "delivery",
    "ifood",
    "rappi",
    "almoco",
    "jantar",
    "lanche",
    "lanchonete",
    "cafeteria",
    "pizza",
    "sushi",
    "hamburguer",
    "bar",
    "cafe",
    "breakfast",
    "lunch",
    "dinner",
    "almuerzo",
    "cena",
    "comida fuera"
  ],
  "Entretenimento": [
    "entretenimento",
    "entertainment",
    "cinema",
    "filmes",
    "movies",
    "music",
    "musica",
    "jogos",
    "games",
    "show",
    "teatro",
    "netflix",
    "spotify",
    "streaming",
    "concierto"
  ],
  "Transporte": [
    "transporte",
    "transportation",
    "carro",
    "car",
    "combustivel",
    "gasolina",
    "gas/fuel",
    "fuel",
    "parking",
    "estacionamento",
    "pedagio",
    "taxi",
    "uber",
    "99",
    "onibus/trem",
    "bus/train",
    "onibus",
    "trem",
    "metro",
    "plane",
    "aviao",
    "passagem",
    "voo",
    "bicycle",
    "bicicleta",
    "mecanico",
    "oficina",
    "pneu",
    "diesel",
    "etanol",
    "lava jato",
    "autobus",
    "tren",
    "vuelo"
  ],
  "Saúde": [
    "saude",
    "health",
    "medical",
    "despesas medicas",
    "medico",
    "farmacia",
    "pharmacy",
    "hospital",
    "dentista",
    "medicamento",
    "consulta medica",
    "salud"
  ],
  "Casa": [
    "casa",
    "household",
    "home",
    "rent",
    "aluguel",
    "condominio",
    "utilities",
    "maintenance",
    "manutencao",
    "limpeza",
    "cleaning",
    "eletricidade",
    "electricity",
    "luz",
    "agua",
    "water",
    "internet",
    "telefone",
    "tv/telefone/internet",
    "furniture",
    "moveis",
    "electronics",
    "eletronicos",
    "faxina",
    "diarista",
    "gas",
    "alquiler",
    "hogar"
  ],
  "Educação": [
    "educacao",
    "education",
    "escola",
    "school",
    "faculdade",
    "universidade",
    "curso",
    "tuition",
    "livro didatico",
    "educacion"
  ],
  "Presentes": [
    "presentes",
    "presente",
    "gifts",
    "gift",
    "regalo",
    "regalos"
  ],
  "Lazer": [
    "lazer",
    "leisure",
    "esportes",
    "sports",
    "passeio",
    "trilha",
    "camping",
    "parque",
    "turismo",
    "viagem",
    "travel",
    "hotel",
    "hospedagem",
    "airbnb",
    "pousada",
    "hostel",
    "recreation",
    "deportes",
    "viaje",
    "ocio"
  ],
  "Vestuário": [
    "vestuario",
    "clothing",
    "roupa",
    "roupas",
    "sapato",
    "tenis",
    "calcado",
    "shoes",
    "ropa",
    "zapatos"
  ],
  "Seguros / Impostos": [
    "seguros / impostos",
    "seguro/impostos",
    "seguro",
    "seguros",
    "insurance",
    "imposto",
    "impostos",
    "tax",
    "taxes",
    "ipva",
    "iptu",
    "seguro de vida",
    "impuestos"
  ],
  "Animais de estimação": [
    "animais de estimacao",
    "pets",
    "pet",
    "pet shop",
    "petshop",
    "veterinario",
    "veterinary",
    "racao",
    "mascotas",
    "mascota",
    "veterinaria"
  ]
};
      const termos = Object.entries(regras).flatMap(([destino, lista]) => lista.map(t => [destino, limpar(t)]));
      const exato = termos.find(([, termo]) => cat === termo);
      if (exato) return exato[0];
      // Frases completas evitam, por exemplo, reconhecer "bar" em "barato".
      const candidatos = termos.filter(([, termo]) => (` ${desc} `).includes(` ${termo} `));
      candidatos.sort((a,b) => b[1].length - a[1].length);
      return candidatos[0]?.[0] || 'Geral';
    }

    const nomesCategorias = {"pt": ["Mercado", "Comer fora", "Entretenimento", "Transporte", "Saúde", "Casa", "Educação", "Presentes", "Lazer", "Vestuário", "Seguros / Impostos", "Animais de estimação", "Geral"], "en": ["Groceries", "Dining out", "Entertainment", "Transport", "Health", "Home", "Education", "Gifts", "Leisure", "Clothing", "Insurance / Taxes", "Pets", "General"], "es": ["Supermercado", "Comer fuera", "Entretenimiento", "Transporte", "Salud", "Casa", "Educación", "Regalos", "Ocio", "Ropa", "Seguros / Impuestos", "Mascotas", "General"]};
    function nomeCategoriaConversor(cat) {
      const indice = nomesCategorias.pt.indexOf(cat);
      const idioma = localStorage.getItem(LANG_STORAGE_KEY) || "pt";
      return (nomesCategorias[idioma] || nomesCategorias.pt)[indice] || getNomeCategoriaTraduzido(cat);
    }

    const dropzone = document.getElementById('dropzone');
    const csvInput = document.getElementById('csv-input');
    const painelConfig = document.getElementById('painel-config');
    const grupoNomeInput = document.getElementById('grupo-nome');
    const mapeamentoNomesDiv = document.getElementById('mapeamento-nomes');
    const resumoDiv = document.getElementById('resumo');
    const btnEnviarApp = document.getElementById('btn-enviar-app');
    const btnBaixar = document.getElementById('btn-baixar');

    let dadosExtraidos = null;

    function quebrarLinhaCSV(linha) {
      const colunas = [];
      let textoAtual = '';
      let entreAspas = false;

      for (const char of linha) {
        if (char === '"') {
          entreAspas = !entreAspas;
        } else if (char === ',' && !entreAspas) {
          colunas.push(textoAtual.trim());
          textoAtual = '';
        } else {
          textoAtual += char;
        }
      }
      colunas.push(textoAtual.trim());
      return colunas;
    }

    function lerCSV(conteudoTexto, nomeArquivo) {
      const linhas = conteudoTexto.split(/\r?\n/).filter(l => l.trim() !== '');
      if (linhas.length < 2) return alert(t('converterEmpty'));

      const cabecalho = quebrarLinhaCSV(linhas[0]);
      const pessoas = cabecalho.slice(5);
      const lancamentos = [];
      const contagemCategorias = {};

      for (let i = 1; i < linhas.length; i++) {
        const cols = quebrarLinhaCSV(linhas[i]);
        if (cols.length < 6) continue;

        const [dataIso, descricao, categoriaRaw, custoStr] = cols;
        const valor = parseFloat(custoStr);

        if (!descricao || descricao.toLowerCase().includes('saldo total') || descricao.toLowerCase().includes('total balance') || isNaN(valor)) continue;

        const [ano, mes, dia] = dataIso.split('-');
        const dataBr = (ano && mes && dia) ? `${dia}/${mes}/${ano}` : dataIso;

        const saldos = {};
        pessoas.forEach((p, idx) => {
          saldos[p] = Math.round((parseFloat(cols[5 + idx]) || 0) * 100) / 100;
        });

        const quemRecebe = pessoas.filter(p => saldos[p] > 0.005);
        const quemDeve = pessoas.filter(p => saldos[p] < -0.005);

        const ehPagamento = normalizarTexto(categoriaRaw).includes('pagamento') ||
          normalizarTexto(categoriaRaw).includes('payment');

        if (ehPagamento && quemRecebe.length === 1 && quemDeve.length === 1) {
          lancamentos.push({
            id: `pgt_${Date.now()}_${i}`,
            tipo: 'pagamento',
            data: dataBr,
            descricao,
            valor,
            deOrig: quemRecebe[0],
            paraOrig: quemDeve[0]
          });
          continue;
        }

        const pagador = quemRecebe[0] || pessoas[pessoas.length - 1];
        const divisao = {};
        const participantes = [];

        quemDeve.forEach(p => {
          divisao[p] = Math.abs(saldos[p]);
          participantes.push(p);
        });

        const parteDoPagador = Math.round((valor - (saldos[pagador] || 0)) * 100) / 100;
        if (parteDoPagador > 0.005) {
          divisao[pagador] = parteDoPagador;
          participantes.unshift(pagador);
        }

        const categoriaFinal = mapearCategoria(categoriaRaw, descricao);
        contagemCategorias[categoriaFinal] = (contagemCategorias[categoriaFinal] || 0) + 1;

        lancamentos.push({
          id: `gst_${Date.now()}_${i}`,
          tipo: 'despesa',
          data: dataBr,
          descricao,
          categoria: categoriaFinal,
          valor,
          pagadorOrig: pagador,
          modoDivisao: 'exato',
          participantesOrig: participantes,
          divisaoOrig: divisao
        });
      }

      dadosExtraidos = { pessoas, lancamentos };

      grupoNomeInput.value = nomeArquivo
        .replace(/\.csv$/i, '')
        .replace(/Exportação do Splitwise para /i, '')
        .replace(/Splitwise export for /i, '');

      mapeamentoNomesDiv.innerHTML = pessoas.map(p => `
        <div class="field">
          <label>${t('converterOriginal')} <em>${p}</em></label>
          <input type="text" class="apelido-input" data-orig="${p}" value="${p.split(' ')[0]}" placeholder="${t('converterName')}">
        </div>
      `).join('');

      const resumoCats = Object.entries(contagemCategorias)
        .map(([cat, qtd]) => `${nomeCategoriaConversor(cat)}: ${qtd}`)
        .join(' • ');

      resumoDiv.innerHTML = `
        <strong>${t('converterReady', { n: lancamentos.length })}</strong><br>
        <small>${resumoCats || t('converterPayments')}</small>
      `;
      painelConfig.classList.remove('hidden');
    }

    function montarEstruturaSplitRAO() {
      const mapaApelidos = {};
      document.querySelectorAll('.apelido-input').forEach(inp => {
        mapaApelidos[inp.dataset.orig] = inp.value.trim() || inp.dataset.orig;
      });

      const grupoId = 'grp_' + Date.now();
      const nomeGrupo = grupoNomeInput.value.trim() || t('converterImported');
      const pessoasMapeadas = dadosExtraidos.pessoas.map(p => mapaApelidos[p]);

      const gastosMapeados = dadosExtraidos.lancamentos.map(item => {
        if (item.tipo === 'pagamento') {
          const deNome = mapaApelidos[item.deOrig] || item.deOrig;
          const paraNome = mapaApelidos[item.paraOrig] || item.paraOrig;
          return {
            id: item.id,
            tipo: 'pagamento',
            data: item.data,
            descricao: item.descricao,
            valor: item.valor,
            moeda: 'BRL',
            taxaCambio: 1,
            valorBRL: item.valor,
            de: deNome,
            para: paraNome
          };
        }

        const novaDivisao = {};
        for (const [pessoa, val] of Object.entries(item.divisaoOrig || {})) {
          const nomePessoa = mapaApelidos[pessoa] || pessoa;
          novaDivisao[nomePessoa] = val;
        }

        return {
          id: item.id,
          tipo: 'despesa',
          data: item.data,
          descricao: item.descricao,
          categoria: item.categoria || 'Geral',
          valor: item.valor,
          moeda: 'BRL',
          taxaCambio: 1,
          valorBRL: item.valor,
          pagador: mapaApelidos[item.pagadorOrig] || item.pagadorOrig,
          modoDivisao: item.modoDivisao || 'exato',
          participantes: (item.participantesOrig || []).map(p => mapaApelidos[p] || p),
          divisao: novaDivisao
        };
      });

      return {
        grupoAtivoId: grupoId,
        grupos: {
          [grupoId]: {
            id: grupoId,
            nome: nomeGrupo,
            pessoas: pessoasMapeadas,
            gastos: gastosMapeados
          }
        }
      };
    }

    dropzone.addEventListener('click', () => csvInput.click());
    csvInput.addEventListener('change', (e) => {
      const arquivo = e.target.files[0];
      if (!arquivo) return;
      const leitor = new FileReader();
      leitor.onload = (ev) => lerCSV(ev.target.result, arquivo.name);
      leitor.readAsText(arquivo, 'UTF-8');
    });

    btnEnviarApp.addEventListener('click', () => {
      if (!dadosExtraidos) return;
      const estruturaFinal = montarEstruturaSplitRAO();
      localStorage.setItem(SPLITWISE_IMPORT_KEY, JSON.stringify(estruturaFinal));
      window.location.href = 'index.html';
    });

    btnBaixar.addEventListener('click', () => {
      if (!dadosExtraidos) return;
      const estruturaFinal = montarEstruturaSplitRAO();
      const blob = new Blob([JSON.stringify(estruturaFinal, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${(grupoNomeInput.value.trim() || 'grupo-importado').toLowerCase().replace(/\s+/g, '-')}.json`;
      link.click();
    });
  </script>
</body>
</html>
